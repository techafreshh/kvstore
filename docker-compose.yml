services:
  worker:
    # Debian-based image, not -alpine: Alpine ships busybox sh only and the
    # probe harness runs its stage scripts with bash inside this container.
    image: node:22
    working_dir: /app
    command: node server.js
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - .:/app
      - worker-data:/data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  worker-data:
